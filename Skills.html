<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUE. SYSTEMS — Skills Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060b09;
    --panel: #0c1512;
    --panel-2: #0a110e;
    --border: #1a2b23;
    --text: #b9d0c4;
    --text-dim: #667a70;
    --heading: #f0f7f2;
    --accent: #3ef598;
    --accent2: #2fb6e0;
    --novice: #4a5b52;
    --beginner: #5a7a68;
    --intermediate: #2fb6e0;
    --proficient: #3ef598;
    --expert: #ffd166;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; overflow-x: hidden; }
  body::before {
    content: ""; position: fixed; inset: 0;
    background: radial-gradient(ellipse 900px 600px at 15% 5%, rgba(62,245,152,0.10), transparent 60%);
    pointer-events: none; z-index: 0;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .hidden { display: none !important; }
  a { color: inherit; text-decoration: none; }
  .display { font-family: 'Anton', sans-serif; font-weight: 400; letter-spacing: 0.5px; }
</style>
</head>
<body>
<style>
  /* NAV */
  nav { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 16px 48px; background: rgba(6,11,9,0.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 12px; }
  .nav-logo { font-family: 'Anton', sans-serif; font-size: 14px; color: var(--heading); display: flex; align-items: center; gap: 8px; }
  .nav-logo .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .pills { display: flex; gap: 10px; flex-wrap: wrap; }
  .pill { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); color: var(--text-dim); transition: all .2s; }
  .pill:hover { border-color: var(--accent2); color: var(--text); }
  .pill.active { background: var(--accent2); border-color: var(--accent2); color: #06120a; }
  .back-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim); border: 1px solid var(--border); padding: 7px 13px; border-radius: 4px; }
  .back-link:hover { border-color: var(--accent); color: var(--accent); }

  /* HEADER */
  .page-header { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 70px 48px 40px; border-bottom: 1px solid var(--border); }
  .page-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 2px; color: var(--accent2); text-transform: uppercase; margin-bottom: 10px; }
  .page-title { font-family: 'Anton', sans-serif; font-size: clamp(32px, 5vw, 52px); color: var(--heading); margin-bottom: 16px; }
  .page-intro { font-size: 14.5px; line-height: 1.7; color: var(--text); max-width: 720px; margin-bottom: 20px; }
  .contact-row { display: flex; gap: 24px; flex-wrap: wrap; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim); }
  .contact-row span { color: var(--accent2); }

  /* SKILLS */
  .skills-main { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 50px 48px 30px; }
  .category-block { margin-bottom: 48px; }
  .category-title { font-family: 'Anton', sans-serif; font-size: 20px; color: var(--heading); margin-bottom: 18px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .skill-row { display: grid; grid-template-columns: 200px 140px 1fr auto; gap: 16px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--panel-2); }
  .skill-name { font-size: 14.5px; font-weight: 600; color: var(--heading); }
  .level-badge { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; padding: 4px 10px; border-radius: 20px; width: fit-content; color: #06120a; }
  .level-select { font-family: 'IBM Plex Mono', monospace; font-size: 11px; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 4px; padding: 5px 8px; }
  .skill-example { font-size: 13px; color: var(--text-dim); line-height: 1.55; }
  .skill-remove { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--accent); background: none; border: 1px solid var(--border); padding: 3px 9px; border-radius: 3px; cursor: pointer; height: fit-content; }
  .add-skill-btn { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--accent2); background: none; border: 1px dashed var(--border); padding: 6px 14px; border-radius: 4px; cursor: pointer; margin-top: 8px; }
  @media (max-width: 720px) { .skill-row { grid-template-columns: 1fr; gap: 6px; } }
</style>
<style>
  /* SKILL GAPS */
  .gaps-section { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 20px 48px 100px; }
  .gaps-title { font-family: 'Anton', sans-serif; font-size: 20px; color: var(--heading); margin-bottom: 16px; }
  .gap-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
  .gap-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent2); flex-shrink: 0; }
  .gap-text { font-size: 14px; color: var(--text); flex: 1; }
  .gap-remove { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--accent); background: none; border: 1px solid var(--border); padding: 3px 9px; border-radius: 3px; cursor: pointer; }

  /* EDIT MODE */
  body.edit-mode [contenteditable="true"] { outline: 1px dashed var(--accent2); outline-offset: 3px; border-radius: 2px; cursor: text; caret-color: var(--accent2); color: inherit; }
  body.edit-mode [contenteditable="true"]:hover { outline-color: var(--accent); }
  body.edit-mode [contenteditable="true"]:focus { outline: 2px solid var(--accent2); background: rgba(47,182,224,0.08); }

  /* EDITOR TOOLBAR */
  #editorToolbar { position: fixed; bottom: 22px; right: 22px; z-index: 100; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; font-family: 'IBM Plex Mono', monospace; }
  .toolbar-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 9px 14px; border-radius: 5px; cursor: pointer; box-shadow: 0 8px 24px -8px rgba(0,0,0,.6); white-space: nowrap; }
  .toolbar-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  .toolbar-btn.accent-btn { background: var(--accent2); color: #06120a; border-color: var(--accent2); font-weight: 600; }
  #editorControls { display: flex; flex-direction: column; gap: 8px; align-items: stretch; background: var(--panel); border: 1px solid var(--border); padding: 14px; border-radius: 8px; box-shadow: 0 8px 24px -8px rgba(0,0,0,.6); min-width: 190px; max-height: 70vh; overflow-y: auto; }
  .color-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--text-dim); }
  .color-row input[type=color] { width: 30px; height: 22px; border: 1px solid var(--border); border-radius: 3px; background: none; cursor: pointer; padding: 0; }

  /* LOGIN MODAL */
  .login-overlay { position: fixed; inset: 0; background: rgba(6,10,17,0.8); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 200; }
  .login-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 28px; width: 280px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.7); }
  .login-title { font-family: 'Anton', sans-serif; font-size: 16px; color: var(--heading); margin-bottom: 8px; }
  .login-note { font-size: 12px; color: var(--text-dim); line-height: 1.5; margin-bottom: 16px; }
  #loginPassword { width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 4px; font-size: 13px; margin-bottom: 14px; font-family: 'IBM Plex Mono', monospace; }
  .login-actions { display: flex; gap: 8px; }
  .login-actions button { flex: 1; font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 9px; border-radius: 4px; cursor: pointer; }
  .btn-primary { background: var(--accent2); color: #06120a; border: 1px solid var(--accent2); }
  .btn-secondary { background: none; color: var(--text); border: 1px solid var(--border); }
  .login-error { color: var(--accent); font-size: 12px; margin-top: 10px; }
</style>

<script>
(function () {
  const CONFIG = JSON.parse(document.getElementById('configData').textContent);
  let editMode = false;
  const LEVELS = ['Novice', 'Beginner', 'Intermediate', 'Proficient', 'Expert'];
  const LEVEL_COLOR = { Novice: 'var(--novice)', Beginner: 'var(--beginner)', Intermediate: 'var(--intermediate)', Proficient: 'var(--proficient)', Expert: 'var(--expert)' };

  const $ = (id) => document.getElementById(id);

  var supabaseClient = null;
  function dbReady() {
    return !!(CONFIG.database && CONFIG.database.enabled && CONFIG.database.supabaseUrl && CONFIG.database.supabaseAnonKey);
  }
  function initDb() {
    if (!dbReady()) return;
    if (typeof supabase === 'undefined') { setSaveStatus('DB script failed to load'); return; }
    try {
      supabaseClient = supabase.createClient(CONFIG.database.supabaseUrl, CONFIG.database.supabaseAnonKey);
    } catch (e) { console.error(e); setSaveStatus('DB connection error'); }
  }
  function setSaveStatus(msg) {
    var el = $('saveStatus');
    if (el) el.textContent = msg;
  }
  function loadFromDatabase() {
    if (!supabaseClient) return Promise.resolve(false);
    return supabaseClient.from(CONFIG.database.table).select('data').eq('id', CONFIG.database.rowId).single()
      .then(function(res) {
        if (res.error || !res.data) return false;
        var db = CONFIG.database;
        Object.keys(res.data.data).forEach(function(k) { CONFIG[k] = res.data.data[k]; });
        CONFIG.database = db;
        return true;
      })
      .catch(function() { return false; });
  }
  function saveToDatabase() {
    if (!supabaseClient) { setSaveStatus('Database not connected'); return Promise.resolve(false); }
    setSaveStatus('Saving...');
    return supabaseClient.from(CONFIG.database.table)
      .upsert({ id: CONFIG.database.rowId, data: CONFIG, updated_at: new Date().toISOString() })
      .then(function(res) {
        if (res.error) { setSaveStatus('Save failed'); console.error(res.error); return false; }
        setSaveStatus('Saved ' + new Date().toLocaleTimeString());
        return true;
      })
      .catch(function(e) { setSaveStatus('Save failed'); console.error(e); return false; });
  }

  function applyTheme() {
    document.documentElement.style.setProperty('--accent', CONFIG.theme.accent);
    document.documentElement.style.setProperty('--accent2', CONFIG.theme.accent2);
    document.documentElement.style.setProperty('--bg', CONFIG.theme.bg);
    updateTextContrast();
  }
  function updateTextContrast() {
    var hex = CONFIG.theme.bg.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(function(c){ return c + c; }).join('');
    var r = parseInt(hex.substr(0, 2), 16), g = parseInt(hex.substr(2, 2), 16), b = parseInt(hex.substr(4, 2), 16);
    var luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    var root = document.documentElement.style;
    if (luminance > 0.55) {
      root.setProperty('--text', '#1c231f');
      root.setProperty('--text-dim', '#5a6960');
      root.setProperty('--heading', '#0c100d');
      root.setProperty('--panel', '#eef1ee');
      root.setProperty('--panel-2', '#e2e6e2');
      root.setProperty('--border', '#c9d1ca');
    } else {
      root.setProperty('--text', '#b9d0c4');
      root.setProperty('--text-dim', '#667a70');
      root.setProperty('--heading', '#f0f7f2');
      root.setProperty('--panel', '#0c1512');
      root.setProperty('--panel-2', '#0a110e');
      root.setProperty('--border', '#1a2b23');
    }
  }

  function applyEditableState() {
    document.querySelectorAll('[data-field], [data-edit]').forEach(function(el) { el.contentEditable = editMode; });
    document.body.classList.toggle('edit-mode', editMode);
  }

  /* ---------- HEADER ---------- */
  function renderHeader() {
    $('navLogo').textContent = CONFIG.siteName;
    document.title = CONFIG.siteName + ' \u2014 Skills Inventory';
    $('pageTitle').textContent = CONFIG.header.title;
    $('pageIntro').textContent = CONFIG.header.intro;
    $('headerName').textContent = CONFIG.header.name;
    $('headerEmail').textContent = CONFIG.header.email;
    $('headerLocation').textContent = CONFIG.header.location;
  }
  function syncHeaderFromDom() {
    CONFIG.siteName = $('navLogo').textContent.trim();
    CONFIG.header.title = $('pageTitle').textContent.trim();
    CONFIG.header.intro = $('pageIntro').textContent.trim();
    CONFIG.header.name = $('headerName').textContent.trim();
    CONFIG.header.email = $('headerEmail').textContent.trim();
    CONFIG.header.location = $('headerLocation').textContent.trim();
  }

  /* ---------- CATEGORIES / SKILLS ---------- */
  function renderCategories() {
    var wrap = $('categoriesWrap');
    wrap.innerHTML = '';
    CONFIG.categories.forEach(function(cat, ci) {
      var block = document.createElement('div');
      block.className = 'category-block';
      var title = document.createElement('div');
      title.className = 'category-title';
      title.setAttribute('data-edit', 'true');
      title.setAttribute('data-cat', ci);
      title.textContent = cat.name;
      block.appendChild(title);

      cat.skills.forEach(function(skill, si) {
        var row = document.createElement('div');
        row.className = 'skill-row';
        var levelHtml = editMode
          ? '<select class="level-select" data-cat="' + ci + '" data-skill="' + si + '">' +
              LEVELS.map(function(l) { return '<option value="' + l + '"' + (l === skill.level ? ' selected' : '') + '>' + l + '</option>'; }).join('') +
            '</select>'
          : '<span class="level-badge" style="background:' + LEVEL_COLOR[skill.level] + '">' + skill.level + '</span>';
        row.innerHTML =
          '<div class="skill-name" data-edit="true" data-cat="' + ci + '" data-skill="' + si + '" data-part="name">' + skill.name + '</div>' +
          '<div class="level-cell">' + levelHtml + '</div>' +
          '<div class="skill-example" data-edit="true" data-cat="' + ci + '" data-skill="' + si + '" data-part="example">' + skill.example + '</div>' +
          (editMode ? '<button class="skill-remove" data-cat="' + ci + '" data-skill="' + si + '">Remove</button>' : '<div></div>');
        block.appendChild(row);
      });

      if (editMode) {
        var addBtn = document.createElement('button');
        addBtn.className = 'add-skill-btn';
        addBtn.textContent = '+ Skill';
        addBtn.onclick = function() {
          syncCategoriesFromDom();
          CONFIG.categories[ci].skills.push({ name: 'New Skill', level: 'Novice', example: 'Where you applied this skill.' });
          renderCategories();
        };
        block.appendChild(addBtn);
      }
      wrap.appendChild(block);
    });

    if (editMode) {
      wrap.querySelectorAll('.skill-remove').forEach(function(btn) {
        btn.onclick = function() {
          syncCategoriesFromDom();
          CONFIG.categories[+btn.dataset.cat].skills.splice(+btn.dataset.skill, 1);
          renderCategories();
        };
      });
      wrap.querySelectorAll('.level-select').forEach(function(sel) {
        sel.onchange = function() {
          CONFIG.categories[+sel.dataset.cat].skills[+sel.dataset.skill].level = sel.value;
        };
      });
    }
    applyEditableState();
  }

  function syncCategoriesFromDom() {
    var wrap = $('categoriesWrap');
    wrap.querySelectorAll('.category-title').forEach(function(el) {
      CONFIG.categories[+el.dataset.cat].name = el.textContent.trim();
    });
    wrap.querySelectorAll('.skill-name').forEach(function(el) {
      var cat = +el.dataset.cat, si = +el.dataset.skill;
      if (CONFIG.categories[cat] && CONFIG.categories[cat].skills[si]) CONFIG.categories[cat].skills[si].name = el.textContent.trim();
    });
    wrap.querySelectorAll('.skill-example').forEach(function(el) {
      var cat = +el.dataset.cat, si = +el.dataset.skill;
      if (CONFIG.categories[cat] && CONFIG.categories[cat].skills[si]) CONFIG.categories[cat].skills[si].example = el.textContent.trim();
    });
    wrap.querySelectorAll('.level-select').forEach(function(sel) {
      var cat = +sel.dataset.cat, si = +sel.dataset.skill;
      if (CONFIG.categories[cat] && CONFIG.categories[cat].skills[si]) CONFIG.categories[cat].skills[si].level = sel.value;
    });
  }

  /* ---------- SKILL GAPS ---------- */
  function renderGaps() {
    var list = $('gapsList');
    list.innerHTML = '';
    CONFIG.skillGaps.forEach(function(gap, i) {
      var row = document.createElement('div');
      row.className = 'gap-row';
      row.innerHTML =
        '<span class="gap-dot"></span>' +
        '<span class="gap-text" data-edit="true" data-i="' + i + '">' + gap + '</span>' +
        (editMode ? '<button class="gap-remove" data-i="' + i + '">Remove</button>' : '');
      list.appendChild(row);
    });
    if (editMode) {
      list.querySelectorAll('.gap-remove').forEach(function(btn) {
        btn.onclick = function() {
          syncGapsFromDom();
          CONFIG.skillGaps.splice(+btn.dataset.i, 1);
          renderGaps();
        };
      });
    }
    applyEditableState();
  }
  function syncGapsFromDom() {
    CONFIG.skillGaps = Array.prototype.map.call($('gapsList').querySelectorAll('.gap-text'), function(el) { return el.textContent.trim(); });
  }

  function renderAll() {
    renderHeader();
    renderCategories();
    renderGaps();
    applyEditableState();
  }
  function syncEverythingFromDom() {
    syncHeaderFromDom();
    syncCategoriesFromDom();
    syncGapsFromDom();
  }

  /* ---------- EDITOR MODE ---------- */
  function unlockEditor() {
    editMode = true;
    $('editorControls').classList.remove('hidden');
    $('editorToggleBtn').textContent = 'Lock';
    $('accentPicker').value = CONFIG.theme.accent;
    $('accent2Picker').value = CONFIG.theme.accent2;
    $('bgPicker').value = CONFIG.theme.bg;
    renderAll();
  }
  function lockEditor() {
    syncEverythingFromDom();
    editMode = false;
    $('editorControls').classList.add('hidden');
    $('editorToggleBtn').textContent = 'Editor';
    renderAll();
    if (dbReady()) saveToDatabase();
  }

  function openLogin() {
    $('loginOverlay').classList.remove('hidden');
    $('loginError').classList.add('hidden');
    $('loginPassword').value = '';
    $('loginPassword').focus();
  }
  function closeLogin() { $('loginOverlay').classList.add('hidden'); }

  function downloadHtml() {
    if (editMode) syncEverythingFromDom();
    var wasEditing = editMode;
    if (wasEditing) lockEditor();
    $('configData').textContent = JSON.stringify(CONFIG, null, 2);
    var htmlStr = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    var blob = new Blob([htmlStr], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'skills.html';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  /* ---------- INIT / EVENTS ---------- */
  initDb();
  Promise.resolve(dbReady() ? loadFromDatabase() : false).then(function(loaded) {
    if (loaded) setSaveStatus('Loaded saved version');
    applyTheme();
    renderAll();
  });

  $('editorToggleBtn').onclick = function() { editMode ? lockEditor() : openLogin(); };
  $('loginCancel').onclick = closeLogin;
  $('loginOverlay').addEventListener('click', function(e) { if (e.target.id === 'loginOverlay') closeLogin(); });
  $('loginSubmit').onclick = function() {
    if ($('loginPassword').value === CONFIG.editorPassword) { closeLogin(); unlockEditor(); }
    else { $('loginError').classList.remove('hidden'); }
  };
  $('loginPassword').addEventListener('keydown', function(e) { if (e.key === 'Enter') $('loginSubmit').click(); });

  $('addGapBtn').onclick = function() { syncGapsFromDom(); CONFIG.skillGaps.push('New skill gap'); renderGaps(); };

  $('saveDbBtn').onclick = function() {
    syncEverythingFromDom();
    if (!dbReady()) { setSaveStatus('Connect a database first (see file comments)'); return; }
    saveToDatabase();
  };
  $('exportBtn').onclick = downloadHtml;
  $('accentPicker').oninput = function(e) { CONFIG.theme.accent = e.target.value; document.documentElement.style.setProperty('--accent', e.target.value); };
  $('accent2Picker').oninput = function(e) { CONFIG.theme.accent2 = e.target.value; document.documentElement.style.setProperty('--accent2', e.target.value); };
  $('bgPicker').oninput = function(e) { CONFIG.theme.bg = e.target.value; document.documentElement.style.setProperty('--bg', e.target.value); updateTextContrast(); };
})();
</script>

</body>
</html>
