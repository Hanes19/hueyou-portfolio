<style>
  :root {
    --bg: #060b09;
    --panel: #0c1512;
    --panel-2: #0a110e;
    --border: #1a2b23;
    --text: #b9d0c4;
    --text-dim: #667a70;
    --heading: #f0f7f2;
    --accent: #3ef598;
    --accent2: #2fb6e0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; overflow-x: hidden; }
  body::before {
    content: ""; position: fixed; inset: 0;
    background: radial-gradient(ellipse 900px 600px at 85% 5%, rgba(47,182,224,0.10), transparent 60%);
    pointer-events: none; z-index: 0;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .hidden { display: none !important; }
  a { color: inherit; text-decoration: none; }
  .display { font-family: 'Anton', sans-serif; font-weight: 400; letter-spacing: 0.5px; }
</style>
</head>
<body>
<style>
  /* NAV */
  nav { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 16px 48px; background: rgba(6,11,9,0.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 12px; }

  .pill:hover { border-color: var(--accent2); color: var(--text); }
  .pill.active { background: var(--accent2); border-color: var(--accent2); color: #06120a; }
  .back-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim); border: 1px solid var(--border); padding: 7px 13px; border-radius: 4px; }

  /* HEADER */
  .page-header { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 70px 48px 40px; border-bottom: 1px solid var(--border); }

  /* GOALS */
  .goals-main { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 50px 48px 30px; }
  .goal-block { margin-bottom: 48px; }
  .goal-title { font-family: 'Anton', sans-serif; font-size: 20px; color: var(--heading); margin-bottom: 6px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .goal-subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--accent2); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 16px; }
  .goal-item { display: flex; align-items: flex-start; gap: 12px; padding: 8px 0; }
  .goal-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-top: 8px; flex-shrink: 0; }
  .goal-text { font-size: 14.5px; line-height: 1.6; color: var(--text); flex: 1; }
  .goal-remove { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--accent); background: none; border: 1px solid var(--border); padding: 3px 9px; border-radius: 3px; cursor: pointer; height: fit-content; }
  .add-item-btn { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--accent2); background: none; border: 1px dashed var(--border); padding: 6px 14px; border-radius: 4px; cursor: pointer; margin-top: 8px; }
  .goal-paragraph { font-size: 14.5px; line-height: 1.75; color: var(--text); max-width: 780px; }
  .industry-block, .motivation-block { padding: 28px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
</style>

  .btn-primary { background: var(--accent2); color: #06120a; border: 1px solid var(--accent2); }
  .btn-secondary { background: none; color: var(--text); border: 1px solid var(--border); }
  .login-error { color: var(--accent); font-size: 12px; margin-top: 10px; }

<script>
(function () {
  const CONFIG = JSON.parse(document.getElementById('configData').textContent);
  let editMode = false;

  const $ = (id) => document.getElementById(id);

  var supabaseClient = null;
  function dbReady() {
    return !!(CONFIG.database && CONFIG.database.enabled && CONFIG.database.supabaseUrl && CONFIG.database.supabaseAnonKey);
  }
  function initDb() {
    if (!dbReady()) return;
    if (typeof supabase === 'undefined') { setSaveStatus('DB script failed to load'); return; }
    try {
      supabaseClient = supabase.createClient(CONFIG.database.supabaseUrl, CONFIG.database.supabaseAnonKey);
    } catch (e) { console.error(e); setSaveStatus('DB connection error'); }
  }
  function setSaveStatus(msg) {
    var el = $('saveStatus');
    if (el) el.textContent = msg;
  }
  function loadFromDatabase() {
    if (!supabaseClient) return Promise.resolve(false);
    return supabaseClient.from(CONFIG.database.table).select('data').eq('id', CONFIG.database.rowId).single()
      .then(function(res) {
        if (res.error || !res.data) return false;
        var db = CONFIG.database;
        Object.keys(res.data.data).forEach(function(k) { CONFIG[k] = res.data.data[k]; });
        CONFIG.database = db;
        return true;
      })
      .catch(function() { return false; });
  }
  function saveToDatabase() {
    if (!supabaseClient) { setSaveStatus('Database not connected'); return Promise.resolve(false); }
    setSaveStatus('Saving...');
    return supabaseClient.from(CONFIG.database.table)
      .upsert({ id: CONFIG.database.rowId, data: CONFIG, updated_at: new Date().toISOString() })
      .then(function(res) {
        if (res.error) { setSaveStatus('Save failed'); console.error(res.error); return false; }
        setSaveStatus('Saved ' + new Date().toLocaleTimeString());
        return true;
      })
      .catch(function(e) { setSaveStatus('Save failed'); console.error(e); return false; });
  }

  function applyTheme() {
    document.documentElement.style.setProperty('--accent', CONFIG.theme.accent);
    document.documentElement.style.setProperty('--accent2', CONFIG.theme.accent2);
    document.documentElement.style.setProperty('--bg', CONFIG.theme.bg);
    updateTextContrast();
  }
  function updateTextContrast() {
    var hex = CONFIG.theme.bg.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(function(c){ return c + c; }).join('');
    var r = parseInt(hex.substr(0, 2), 16), g = parseInt(hex.substr(2, 2), 16), b = parseInt(hex.substr(4, 2), 16);
    var luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    var root = document.documentElement.style;
    if (luminance > 0.55) {
      root.setProperty('--text', '#1c231f');
      root.setProperty('--text-dim', '#5a6960');
      root.setProperty('--heading', '#0c100d');
      root.setProperty('--panel', '#eef1ee');
      root.setProperty('--panel-2', '#e2e6e2');
      root.setProperty('--border', '#c9d1ca');
    } else {
      root.setProperty('--text', '#b9d0c4');
      root.setProperty('--text-dim', '#667a70');
      root.setProperty('--heading', '#f0f7f2');
      root.setProperty('--panel', '#0c1512');
      root.setProperty('--panel-2', '#0a110e');
      root.setProperty('--border', '#1a2b23');
    }
  }

  function applyEditableState() {
    document.querySelectorAll('[data-field], [data-edit]').forEach(function(el) { el.contentEditable = editMode; });
    document.body.classList.toggle('edit-mode', editMode);
  }

  /* ---------- HEADER ---------- */
  function renderHeader() {
    $('navLogo').textContent = CONFIG.siteName;
    document.title = CONFIG.siteName + ' \u2014 Career Goals';
    $('pageTitle').textContent = CONFIG.header.title;
    $('pageIntro').textContent = CONFIG.header.intro;
    $('headerName').textContent = CONFIG.header.name;
    $('headerEmail').textContent = CONFIG.header.email;
    $('headerLocation').textContent = CONFIG.header.location;
  }
  function syncHeaderFromDom() {
    CONFIG.siteName = $('navLogo').textContent.trim();
    CONFIG.header.title = $('pageTitle').textContent.trim();
    CONFIG.header.intro = $('pageIntro').textContent.trim();
    CONFIG.header.name = $('headerName').textContent.trim();
    CONFIG.header.email = $('headerEmail').textContent.trim();
    CONFIG.header.location = $('headerLocation').textContent.trim();
  }

  /* ---------- GENERIC GOAL LIST (reused for short/mid/long-term + skill plan) ---------- */
  function renderGoalList(listElId, items, onChange) {
    var list = $(listElId);
    list.innerHTML = '';
    items.forEach(function(text, i) {
      var row = document.createElement('div');
      row.className = 'goal-item';
      row.innerHTML =
        '<span class="goal-dot"></span>' +
        '<span class="goal-text" data-edit="true" data-i="' + i + '">' + text + '</span>' +
        (editMode ? '<button class="goal-remove" data-i="' + i + '">Remove</button>' : '');
      list.appendChild(row);
    });
    if (editMode) {
      list.querySelectorAll('.goal-remove').forEach(function(btn) {
        btn.onclick = function() {
          syncGoalListFromDom(listElId, items);
          items.splice(+btn.dataset.i, 1);
          onChange();
        };
      });
    }
  }
  function syncGoalListFromDom(listElId, items) {
    var texts = Array.prototype.map.call($(listElId).querySelectorAll('.goal-text'), function(el) { return el.textContent.trim(); });
    items.length = 0;
    texts.forEach(function(t) { items.push(t); });
  }

  /* ---------- SECTION RENDERERS ---------- */
  function renderShort() {
    $('shortTitle').textContent = CONFIG.shortTitle;
    $('shortSubtitle').textContent = CONFIG.shortSubtitle;
    renderGoalList('shortList', CONFIG.shortTermGoals, renderShort);
  }
  function renderMid() {
    $('midTitle').textContent = CONFIG.midTitle;
    $('midSubtitle').textContent = CONFIG.midSubtitle;
    renderGoalList('midList', CONFIG.midTermGoals, renderMid);
  }
  function renderLong() {
    $('longTitle').textContent = CONFIG.longTitle;
    $('longSubtitle').textContent = CONFIG.longSubtitle;
    renderGoalList('longList', CONFIG.longTermGoals, renderLong);
  }
  function renderSkillPlan() {
    renderGoalList('skillPlanList', CONFIG.skillDevelopmentPlan, renderSkillPlan);
  }
  function renderIndustryAndMotivation() {
    $('industryText').textContent = CONFIG.industry;
    $('motivationText').textContent = CONFIG.motivation;
  }

  function syncGoalsFromDom() {
    CONFIG.shortTitle = $('shortTitle').textContent.trim();
    CONFIG.shortSubtitle = $('shortSubtitle').textContent.trim();
    syncGoalListFromDom('shortList', CONFIG.shortTermGoals);

    CONFIG.midTitle = $('midTitle').textContent.trim();
    CONFIG.midSubtitle = $('midSubtitle').textContent.trim();
    syncGoalListFromDom('midList', CONFIG.midTermGoals);

    CONFIG.longTitle = $('longTitle').textContent.trim();
    CONFIG.longSubtitle = $('longSubtitle').textContent.trim();
    syncGoalListFromDom('longList', CONFIG.longTermGoals);

    syncGoalListFromDom('skillPlanList', CONFIG.skillDevelopmentPlan);

    CONFIG.industry = $('industryText').textContent.trim();
    CONFIG.motivation = $('motivationText').textContent.trim();
  }

  function renderAll() {
    renderHeader();
    renderShort();
    renderMid();
    renderLong();
    renderSkillPlan();
    renderIndustryAndMotivation();
    applyEditableState();
  }
  function syncEverythingFromDom() {
    syncHeaderFromDom();
    syncGoalsFromDom();
  }

  /* ---------- EDITOR MODE ---------- */
  function unlockEditor() {
    editMode = true;
    $('editorControls').classList.remove('hidden');
    $('editorToggleBtn').textContent = 'Lock';
    $('accentPicker').value = CONFIG.theme.accent;
    $('accent2Picker').value = CONFIG.theme.accent2;
    $('bgPicker').value = CONFIG.theme.bg;
    renderAll();
  }
  function lockEditor() {
    syncEverythingFromDom();
    editMode = false;
    $('editorControls').classList.add('hidden');
    $('editorToggleBtn').textContent = 'Editor';
    renderAll();
    if (dbReady()) saveToDatabase();
  }

  function openLogin() {
    $('loginOverlay').classList.remove('hidden');
    $('loginError').classList.add('hidden');
    $('loginPassword').value = '';
    $('loginPassword').focus();
  }
  function closeLogin() { $('loginOverlay').classList.add('hidden'); }

  function downloadHtml() {
    if (editMode) syncEverythingFromDom();
    var wasEditing = editMode;
    if (wasEditing) lockEditor();
    $('configData').textContent = JSON.stringify(CONFIG, null, 2);
    var htmlStr = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    var blob = new Blob([htmlStr], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'career-goals.html';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  /* ---------- INIT / EVENTS ---------- */
  initDb();
  Promise.resolve(dbReady() ? loadFromDatabase() : false).then(function(loaded) {
    if (loaded) setSaveStatus('Loaded saved version');
    applyTheme();
    renderAll();
  });

  $('editorToggleBtn').onclick = function() { editMode ? lockEditor() : openLogin(); };
  $('loginCancel').onclick = closeLogin;
  $('loginOverlay').addEventListener('click', function(e) { if (e.target.id === 'loginOverlay') closeLogin(); });
  $('loginSubmit').onclick = function() {
    if ($('loginPassword').value === CONFIG.editorPassword) { closeLogin(); unlockEditor(); }
    else { $('loginError').classList.remove('hidden'); }
  };
  $('loginPassword').addEventListener('keydown', function(e) { if (e.key === 'Enter') $('loginSubmit').click(); });

  $('addShortBtn').onclick = function() { syncGoalListFromDom('shortList', CONFIG.shortTermGoals); CONFIG.shortTermGoals.push('New short-term goal'); renderShort(); applyEditableState(); };
  $('addMidBtn').onclick = function() { syncGoalListFromDom('midList', CONFIG.midTermGoals); CONFIG.midTermGoals.push('New mid-term goal'); renderMid(); applyEditableState(); };
  $('addLongBtn').onclick = function() { syncGoalListFromDom('longList', CONFIG.longTermGoals); CONFIG.longTermGoals.push('New long-term goal'); renderLong(); applyEditableState(); };
  $('addSkillPlanBtn').onclick = function() { syncGoalListFromDom('skillPlanList', CONFIG.skillDevelopmentPlan); CONFIG.skillDevelopmentPlan.push('New skill to develop'); renderSkillPlan(); applyEditableState(); };

  $('saveDbBtn').onclick = function() {
    syncEverythingFromDom();
    if (!dbReady()) { setSaveStatus('Connect a database first (see file comments)'); return; }
    saveToDatabase();
  };
  $('exportBtn').onclick = downloadHtml;
  $('accentPicker').oninput = function(e) { CONFIG.theme.accent = e.target.value; document.documentElement.style.setProperty('--accent', e.target.value); };
  $('accent2Picker').oninput = function(e) { CONFIG.theme.accent2 = e.target.value; document.documentElement.style.setProperty('--accent2', e.target.value); };
  $('bgPicker').oninput = function(e) { CONFIG.theme.bg = e.target.value; document.documentElement.style.setProperty('--bg', e.target.value); updateTextContrast(); };
})();
</script>

</body>
</html>
