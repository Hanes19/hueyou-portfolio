<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUE. SYSTEMS — Choose a Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d0b;
    --panel: #101512;
    --panel-2: #0d1210;
    --border: #1e2a22;
    --text: #cfd9d2;
    --text-dim: #6f7d74;
    --accent: #3ef598;
    --accent-dim: #1f8055;
    --amber: #ffb454;
    --red: #ff6b5e;
    --heading: #eef4ef;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; overflow-x: hidden; }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(62, 245, 152, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(62, 245, 152, 0.025) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  .mono { font-family: 'IBM Plex Mono', monospace; }
  a { color: inherit; text-decoration: none; }
  .hidden { display: none !important; }

  /* NAV */
  nav {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 48px;
    background: rgba(10, 13, 11, 0.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .logo { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 15px; letter-spacing: 0.5px; display: flex; align-items: center; gap: 10px; }
  .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .nav-links { display: flex; gap: 36px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--text-dim); }
  .nav-links a { transition: color 0.2s; position: relative; }
  .nav-links a:hover { color: var(--accent); }
  .nav-links span { color: var(--accent-dim); margin-right: 4px; }
  .switch-btn { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim); background: none; border: 1px solid var(--border); padding: 7px 13px; border-radius: 4px; cursor: pointer; transition: border-color .15s, color .15s; }
  .switch-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* GATEWAY */
  .gateway { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 24px; position: relative; z-index: 1; }
  .gateway-inner { max-width: 760px; width: 100%; text-align: center; }
  .gateway-logo { justify-content: center; margin-bottom: 32px; font-size: 15px; }
  .gateway-title { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: clamp(26px, 4vw, 40px); color: var(--heading); margin-bottom: 14px; }
  .gateway-subtitle { color: var(--text-dim); font-size: 15px; margin-bottom: 48px; }
  .gateway-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .gateway-choice { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 32px 26px; text-align: left; transition: border-color .2s, transform .2s; }
  .gateway-choice:hover { border-color: var(--accent-dim); transform: translateY(-3px); }
  .gateway-choice-label { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 18px; color: var(--heading); margin-bottom: 10px; }
  .gateway-choice-desc { color: var(--text-dim); font-size: 13.5px; line-height: 1.6; margin-bottom: 24px; min-height: 42px; }
  .gateway-open-btn { width: 100%; justify-content: center; }
  @media (max-width: 640px) {
    .gateway-choices { grid-template-columns: 1fr; }
  }

  /* HERO / CAROUSEL */
  .hero-carousel { position: relative; z-index: 1; max-width: 1320px; margin: 0 auto; padding: 90px 64px 60px; }
  .hero-slide-wrap { transition: opacity 0.25s ease; }
  .hero-slide-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }

  .carousel-arrow {
    position: absolute; top: 45%; transform: translateY(-50%);
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    width: 38px; height: 38px; border-radius: 50%; font-size: 18px; cursor: pointer;
    z-index: 5; display: flex; align-items: center; justify-content: center;
    transition: border-color .15s, color .15s;
  }
  .carousel-arrow:hover { border-color: var(--accent); color: var(--accent); }
  .carousel-arrow.prev { left: 4px; }
  .carousel-arrow.next { right: 4px; }

  .carousel-dots { display: flex; gap: 8px; justify-content: center; margin-top: 32px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); border: none; cursor: pointer; padding: 0; transition: background .15s, transform .15s; }
  .dot.active { background: var(--accent); transform: scale(1.3); }

  .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .eyebrow::before { content: ""; width: 24px; height: 1px; background: var(--accent-dim); }

  h1 { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: clamp(32px, 3.6vw, 52px); line-height: 1.12; letter-spacing: -0.5px; color: var(--heading); margin-bottom: 24px; }
  h1 .accent-text { color: var(--accent); }

  .lede { font-size: 17px; line-height: 1.65; color: var(--text-dim); max-width: 480px; margin-bottom: 36px; }

  .hero-ctas { display: flex; gap: 14px; align-items: center; }
  .btn-primary { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; background: var(--accent); color: #06120a; padding: 13px 22px; border-radius: 3px; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--accent); cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 22px -6px rgba(62,245,152,0.5); }
  .btn-secondary { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--text); background: none; padding: 13px 20px; border: 1px solid var(--border); border-radius: 3px; cursor: pointer; transition: border-color 0.15s, color 0.15s; }
  .btn-secondary:hover { border-color: var(--accent-dim); color: var(--accent); }

  .hero-meta { display: flex; gap: 28px; margin-top: 44px; padding-top: 24px; border-top: 1px solid var(--border); font-family: 'IBM Plex Mono', monospace; }
  .hero-meta > div { display: flex; flex-direction: column; }
  .stat-value { font-size: 22px; font-weight: 600; color: var(--heading); }
  .stat-label { display: block; font-size: 11px; color: var(--text-dim); margin-top: 4px; letter-spacing: 0.5px; }

  /* MOCKUP */
  .mockup { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; box-shadow: 0 30px 80px -30px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.02); }
  .mockup-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--panel-2); border-bottom: 1px solid var(--border); }
  .mockup-dots { display: flex; gap: 6px; }
  .mockup-dots span { width: 9px; height: 9px; border-radius: 50%; background: #2a352d; }
  .mockup-title { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim); letter-spacing: 0.5px; }
  .mockup-body { padding: 20px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.9; min-height: 260px; position: relative; }
  .mockup-body.has-photo { padding: 0; }
  .mockup-photo { width: 100%; height: 260px; object-fit: cover; display: block; }
  .photo-upload-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; min-height: 220px; gap: 10px; }
  .photo-upload-btn { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent); background: none; border: 1px dashed var(--border); padding: 10px 18px; border-radius: 5px; cursor: pointer; }
  .photo-upload-btn:hover { border-color: var(--accent); }
  .photo-upload-hint { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--text-dim); }
  .photo-controls { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 3; }
  .photo-controls button { font-family: 'IBM Plex Mono', monospace; font-size: 10px; padding: 4px 9px; border-radius: 3px; cursor: pointer; background: rgba(10,13,11,0.8); border: 1px solid var(--border); color: var(--text); }
  .photo-controls button:hover { border-color: var(--accent); color: var(--accent); }
  .photo-controls button.danger:hover { border-color: var(--red); color: var(--red); }
  .inline-photo-controls { display: flex; gap: 8px; margin: 10px 0 18px; }
  .inline-photo-controls button { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--text-dim); background: none; border: 1px dashed var(--border); padding: 4px 10px; border-radius: 3px; cursor: pointer; }
  .inline-photo-controls button:hover { border-color: var(--accent); color: var(--accent); }
  .inline-photo-controls button.danger:hover { border-color: var(--red); color: var(--red); }
  .photo-upload-empty.compact { min-height: 90px; margin-bottom: 20px; }
  .card-photo-wrap { margin: -32px -32px 20px -32px; overflow: hidden; }
  .card-photo-wrap img { width: 100%; height: 150px; object-fit: cover; display: block; }
  .gateway-choice { overflow: hidden; }
  .gateway-choice-photo-wrap { margin: -32px -26px 20px -26px; }
  .gateway-choice-photo-wrap img { width: 100%; height: 130px; object-fit: cover; display: block; }

  .thumb-wrap { position: relative; margin-bottom: 16px; }
  .thumb-wrap .photo-controls { top: 6px; right: 6px; }
  .card-thumb { width: 100%; height: 130px; object-fit: cover; display: block; border-radius: 6px; border: 1px solid var(--border); }
  .card-thumb-empty { width: 100%; height: 52px; border: 1px dashed var(--border); border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: none; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--accent); transition: border-color .15s; }
  .card-thumb-empty:hover { border-color: var(--accent); }

  .term-line { display: flex; align-items: center; gap: 10px; opacity: 0; animation: fadeIn 0.4s forwards; }
  .term-text.prompt { color: var(--accent-dim); }
  .term-text.ok { color: var(--accent); }
  .term-text.warn { color: var(--amber); }
  .term-text.dim { color: var(--text-dim); }
  @keyframes fadeIn { to { opacity: 1; } }

  .cursor { display: inline-block; width: 7px; height: 14px; background: var(--accent); animation: blink 1s step-end infinite; vertical-align: middle; }
  @keyframes blink { 50% { opacity: 0; } }

  .mockup-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border-top: 1px solid var(--border); }
  .mockup-stats > div { background: var(--panel); padding: 16px 18px; }
  .stat-val { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; color: var(--heading); }
  .mockup-stats .stat-label { font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; }
  .stat-val.up { color: var(--accent); }

  /* SECTIONS */
  section { position: relative; z-index: 1; max-width: 1320px; margin: 0 auto; padding: 60px 48px 90px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 48px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
  .section-label { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
  .section-title { font-family: 'IBM Plex Mono', monospace; font-size: 28px; font-weight: 600; color: var(--heading); margin-top: 8px; }
  .section-count { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--text-dim); }

  .projects-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); }
  .project-card { position: relative; background: var(--bg); padding: 32px; transition: background 0.2s; }
  .project-card:hover { background: var(--panel); }
  .project-status { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }
  .project-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .project-card h3 { font-size: 19px; font-weight: 600; color: var(--heading); margin-bottom: 10px; font-family: 'IBM Plex Sans', sans-serif; }
  .project-card p { font-size: 14px; color: var(--text-dim); line-height: 1.6; margin-bottom: 20px; }
  .project-stack { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tag { display: inline-flex; align-items: center; gap: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--text-dim); border: 1px solid var(--border); padding: 3px 8px; border-radius: 3px; }
  .tag-text { min-width: 8px; }
  .tag-x { background: none; border: none; color: var(--red); cursor: pointer; font-size: 11px; padding: 0; line-height: 1; }
  .tag-add { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--accent); background: none; border: 1px dashed var(--border); padding: 3px 8px; border-radius: 3px; cursor: pointer; }
  .card-remove { position: absolute; top: 10px; right: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--red); background: none; border: 1px solid var(--border); padding: 3px 9px; border-radius: 3px; cursor: pointer; }
  .card-remove:hover { border-color: var(--red); }
  .add-card { display: flex; align-items: center; justify-content: center; border: 1px dashed var(--border); background: var(--bg); }
  .card-add-btn { font-family: 'IBM Plex Mono', monospace; color: var(--accent); background: none; border: none; font-size: 14px; cursor: pointer; }

  .line-x { background: none; border: none; color: var(--red); font-size: 11px; cursor: pointer; }
  .line-add { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--accent); background: none; border: 1px dashed var(--border); padding: 3px 10px; border-radius: 3px; cursor: pointer; margin-top: 8px; }

  footer { border-top: 1px solid var(--border); padding: 40px 48px; display: flex; justify-content: space-between; align-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim); position: relative; z-index: 1; }

  /* EDIT MODE */
  body.edit-mode [contenteditable="true"] { outline: 1px dashed var(--accent-dim); outline-offset: 3px; border-radius: 2px; cursor: text; caret-color: var(--accent); color: inherit; -webkit-text-fill-color: currentColor; }
  body.edit-mode [contenteditable="true"]:hover { outline-color: var(--accent); }
  body.edit-mode [contenteditable="true"]:focus { outline: 2px solid var(--accent); background: rgba(62,245,152,0.1); }

  /* EDITOR TOOLBAR */
  #editorToolbar { position: fixed; bottom: 22px; right: 22px; z-index: 100; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; font-family: 'IBM Plex Mono', monospace; }
  .toolbar-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 9px 14px; border-radius: 5px; cursor: pointer; transition: border-color .15s, color .15s; box-shadow: 0 8px 24px -8px rgba(0,0,0,.6); white-space: nowrap; }
  .toolbar-btn:hover { border-color: var(--accent); color: var(--accent); }
  .toolbar-btn.accent-btn { background: var(--accent); color: #06120a; border-color: var(--accent); font-weight: 600; }
  .toolbar-btn.accent-btn:hover { color: #06120a; opacity: 0.9; }
  #editorControls { display: flex; flex-direction: column; gap: 8px; align-items: stretch; background: var(--panel); border: 1px solid var(--border); padding: 14px; border-radius: 8px; box-shadow: 0 8px 24px -8px rgba(0,0,0,.6); min-width: 180px; }
  .color-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--text-dim); }
  .color-row input[type=color] { width: 30px; height: 22px; border: 1px solid var(--border); border-radius: 3px; background: none; cursor: pointer; padding: 0; }

  /* LOGIN MODAL */
  .login-overlay { position: fixed; inset: 0; background: rgba(6,10,8,0.75); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 200; }
  .login-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 28px; width: 280px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.7); }
  .login-title { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; color: var(--heading); margin-bottom: 8px; }
  .login-note { font-size: 12px; color: var(--text-dim); line-height: 1.5; margin-bottom: 16px; }
  #loginPassword { width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 4px; font-size: 13px; margin-bottom: 14px; font-family: 'IBM Plex Mono', monospace; }
  .login-actions { display: flex; gap: 8px; }
  .login-actions button { flex: 1; }
  .login-error { color: var(--red); font-size: 12px; margin-top: 10px; }

  @media (max-width: 900px) {
    .hero-slide-inner { grid-template-columns: 1fr; }
    .hero-carousel { padding: 50px 24px 40px; }
    .carousel-arrow { display: none; }
    .projects-grid { grid-template-columns: 1fr; }
    nav { padding: 16px 20px; }
    .nav-links { display: none; }
    section { padding: 40px 20px 60px; }
    #editorToolbar { right: 12px; bottom: 12px; }
  }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>

<script>
(function () {
  const CONFIG = JSON.parse(document.getElementById('configData').textContent);
  let editMode = false;

  const $ = (id) => document.getElementById(id);

  var supabaseClient = null;
  function dbReady() {
    return !!(CONFIG.database && CONFIG.database.enabled && CONFIG.database.supabaseUrl && CONFIG.database.supabaseAnonKey);
  }
  function initDb() {
    if (!dbReady()) return;
    if (typeof supabase === 'undefined') { setSaveStatus('DB script failed to load'); return; }
    try {
      supabaseClient = supabase.createClient(CONFIG.database.supabaseUrl, CONFIG.database.supabaseAnonKey);
    } catch (e) { console.error(e); setSaveStatus('DB connection error'); }
  }
  function setSaveStatus(msg) {
    var el = $('saveStatus');
    if (el) el.textContent = msg;
  }
  function loadFromDatabase() {
    if (!supabaseClient) return Promise.resolve(false);
    return supabaseClient.from(CONFIG.database.table).select('data').eq('id', CONFIG.database.rowId).single()
      .then(function(res) {
        if (res.error || !res.data) return false;
        var db = CONFIG.database;
        Object.keys(res.data.data).forEach(function(k) { CONFIG[k] = res.data.data[k]; });
        CONFIG.database = db;
        return true;
      })
      .catch(function() { return false; });
  }
  function saveToDatabase() {
    if (!supabaseClient) { setSaveStatus('Database not connected'); return Promise.resolve(false); }
    setSaveStatus('Saving...');
    return supabaseClient.from(CONFIG.database.table)
      .upsert({ id: CONFIG.database.rowId, data: CONFIG, updated_at: new Date().toISOString() })
      .then(function(res) {
        if (res.error) { setSaveStatus('Save failed'); console.error(res.error); return false; }
        setSaveStatus('Saved ' + new Date().toLocaleTimeString());
        return true;
      })
      .catch(function(e) { setSaveStatus('Save failed'); console.error(e); return false; });
  }
  function storageReady() {
    return dbReady() && !!CONFIG.database.bucket && !!supabaseClient;
  }

  function applyTheme() {
    document.documentElement.style.setProperty('--accent', CONFIG.theme.accent);
    document.documentElement.style.setProperty('--bg', CONFIG.theme.bg);
    updateTextContrast();
  }
  function updateTextContrast() {
    var hex = CONFIG.theme.bg.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(function(c){ return c + c; }).join('');
    var r = parseInt(hex.substr(0, 2), 16), g = parseInt(hex.substr(2, 2), 16), b = parseInt(hex.substr(4, 2), 16);
    var luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    var root = document.documentElement.style;
    if (luminance > 0.55) {
      root.setProperty('--text', '#1c231f');
      root.setProperty('--text-dim', '#5a6960');
      root.setProperty('--heading', '#0c100d');
      root.setProperty('--panel', '#eef1ee');
      root.setProperty('--panel-2', '#e2e6e2');
      root.setProperty('--border', '#c9d1ca');
    } else {
      root.setProperty('--text', '#cfd9d2');
      root.setProperty('--text-dim', '#6f7d74');
      root.setProperty('--heading', '#eef4ef');
      root.setProperty('--panel', '#101512');
      root.setProperty('--panel-2', '#0d1210');
      root.setProperty('--border', '#1e2a22');
    }
  }

  function applyEditableState() {
    document.querySelectorAll('[data-field], #gLogo, #gTitle, #gSubtitle').forEach(function(el) { el.contentEditable = editMode; });
    document.body.classList.toggle('edit-mode', editMode);
  }

  function renderGateway() {
    $('gLogo').textContent = CONFIG.siteName;
    $('gTitle').textContent = CONFIG.gateway.title;
    $('gSubtitle').textContent = CONFIG.gateway.subtitle;

    var wrap = $('gatewayChoices');
    wrap.innerHTML = '';
    CONFIG.gateway.choices.forEach(function(choice, i) {
      var card = document.createElement('div');
      card.className = 'gateway-choice';
      var photoHtml;
      if (choice.image) {
        photoHtml = '<div class="gateway-choice-photo-wrap"><img src="' + choice.image + '" alt="' + choice.label + '"></div>' +
          (editMode ? '<div class="inline-photo-controls"><button class="gw-photo-replace">Replace photo</button><button class="gw-photo-remove danger">Remove photo</button></div>' : '');
      } else if (editMode) {
        photoHtml = '<div class="gateway-choice-photo-wrap photo-upload-empty compact"><button class="photo-upload-btn gw-photo-add">+ Photo</button></div>';
      } else {
        photoHtml = '';
      }
      card.innerHTML =
        photoHtml +
        '<div class="gateway-choice-label" data-field="label">' + choice.label + '</div>' +
        '<div class="gateway-choice-desc" data-field="description">' + choice.description + '</div>' +
        '<a class="btn-primary gateway-open-btn" href="' + choice.href + '">Open ' + choice.label + ' \u2192</a>';
      if (editMode) {
        var addBtn = card.querySelector('.gw-photo-add');
        if (addBtn) addBtn.onclick = function() { uploadGatewayPhoto(i); };
        var replaceBtn = card.querySelector('.gw-photo-replace');
        if (replaceBtn) replaceBtn.onclick = function() { uploadGatewayPhoto(i); };
        var removeBtn = card.querySelector('.gw-photo-remove');
        if (removeBtn) removeBtn.onclick = function() {
          syncGatewayFromDom();
          CONFIG.gateway.choices[i].image = null;
          renderGateway();
        };
        // Prevent the Open link from navigating away while actively editing text
        card.querySelector('.gateway-open-btn').addEventListener('click', function(e) {
          if (document.activeElement && card.contains(document.activeElement) && document.activeElement.isContentEditable) {
            e.preventDefault();
          }
        });
      }
      wrap.appendChild(card);
    });
    applyEditableState();
  }

  function syncGatewayFromDom() {
    CONFIG.siteName = $('gLogo').textContent.trim();
    CONFIG.gateway.title = $('gTitle').textContent.trim();
    CONFIG.gateway.subtitle = $('gSubtitle').textContent.trim();
    var cards = document.querySelectorAll('.gateway-choice');
    cards.forEach(function(card, i) {
      if (!CONFIG.gateway.choices[i]) return;
      CONFIG.gateway.choices[i].label = card.querySelector('[data-field="label"]').textContent.trim();
      CONFIG.gateway.choices[i].description = card.querySelector('[data-field="description"]').textContent.trim();
    });
  }

  function triggerPhotoUpload(pathHint, onDone) {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = function() {
      var file = input.files[0];
      if (!file) return;
      setSaveStatus('Processing photo...');
      resizeImageToBlob(file, 900, 0.85).then(function(result) {
        if (storageReady()) {
          setSaveStatus('Uploading photo...');
          return uploadImageBlob(result.blob, pathHint)
            .then(function(url) { setSaveStatus('Photo uploaded'); onDone(url); })
            .catch(function(e) {
              console.error(e);
              setSaveStatus('Upload failed, saved locally instead');
              onDone(result.dataUrl);
            });
        } else {
          onDone(result.dataUrl);
        }
      }).catch(function(e) {
        console.error(e);
        alert('Could not load that image.');
      });
    };
    input.click();
  }

  function uploadImageBlob(blob, pathHint) {
    var path = pathHint + '-' + Date.now() + '.jpg';
    return supabaseClient.storage.from(CONFIG.database.bucket)
      .upload(path, blob, { contentType: 'image/jpeg', upsert: true })
      .then(function(res) {
        if (res.error) throw res.error;
        var pub = supabaseClient.storage.from(CONFIG.database.bucket).getPublicUrl(path);
        return pub.data.publicUrl;
      });
  }

  function resizeImageToBlob(file, maxWidth, quality) {
    return new Promise(function(resolve, reject) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var scale = Math.min(1, maxWidth / img.width);
          var canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(function(blob) {
            if (!blob) { reject(new Error('Could not process image')); return; }
            resolve({ blob: blob, dataUrl: canvas.toDataURL('image/jpeg', quality) });
          }, 'image/jpeg', quality);
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function uploadGatewayPhoto(i) {
    syncGatewayFromDom();
    var pathHint = 'gateway-choice-' + i;
    triggerPhotoUpload(pathHint, function(url) {
      CONFIG.gateway.choices[i].image = url;
      renderGateway();
    });
  }

  function unlockEditor() {
    editMode = true;
    $('editorControls').classList.remove('hidden');
    $('editorToggleBtn').textContent = 'Lock';
    $('accentPicker').value = CONFIG.theme.accent;
    $('bgPicker').value = CONFIG.theme.bg;
    renderGateway();
  }
  function lockEditor() {
    syncGatewayFromDom();
    editMode = false;
    $('editorControls').classList.add('hidden');
    $('editorToggleBtn').textContent = 'Editor';
    renderGateway();
    if (dbReady()) saveToDatabase();
  }

  function openLogin() {
    $('loginOverlay').classList.remove('hidden');
    $('loginError').classList.add('hidden');
    $('loginPassword').value = '';
    $('loginPassword').focus();
  }
  function closeLogin() { $('loginOverlay').classList.add('hidden'); }

  function downloadHtml() {
    if (editMode) syncGatewayFromDom();
    var wasEditing = editMode;
    if (wasEditing) lockEditor();
    $('configData').textContent = JSON.stringify(CONFIG, null, 2);
    var htmlStr = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    var blob = new Blob([htmlStr], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'index.html';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  /* ---------- INIT / EVENTS ---------- */
  initDb();
  Promise.resolve(dbReady() ? loadFromDatabase() : false).then(function(loaded) {
    if (loaded) setSaveStatus('Loaded saved version');
    applyTheme();
    renderGateway();
  });

  $('editorToggleBtn').onclick = function() { editMode ? lockEditor() : openLogin(); };
  $('loginCancel').onclick = closeLogin;
  $('loginOverlay').addEventListener('click', function(e) { if (e.target.id === 'loginOverlay') closeLogin(); });
  $('loginSubmit').onclick = function() {
    if ($('loginPassword').value === CONFIG.editorPassword) { closeLogin(); unlockEditor(); }
    else { $('loginError').classList.remove('hidden'); }
  };
  $('loginPassword').addEventListener('keydown', function(e) { if (e.key === 'Enter') $('loginSubmit').click(); });

  $('saveDbBtn').onclick = function() {
    syncGatewayFromDom();
    if (!dbReady()) { setSaveStatus('Connect a database first (see file comments)'); return; }
    saveToDatabase();
  };
  $('exportBtn').onclick = downloadHtml;
  $('accentPicker').oninput = function(e) { CONFIG.theme.accent = e.target.value; document.documentElement.style.setProperty('--accent', e.target.value); };
  $('bgPicker').oninput = function(e) { CONFIG.theme.bg = e.target.value; document.documentElement.style.setProperty('--bg', e.target.value); updateTextContrast(); };
})();
</script>

</body>
</html>
