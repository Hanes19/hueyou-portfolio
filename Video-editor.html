    z-index: 0;

  .mono { font-family: 'IBM Plex Mono', monospace; }
  .hidden { display: none !important; }
  a { color: inherit; text-decoration: none; }
  .display { font-family: 'Anton', sans-serif; font-weight: 400; letter-spacing: 0.5px; }

<script>
(function () {
  const CONFIG = JSON.parse(document.getElementById('configData').textContent);
  let editMode = false;

  const $ = (id) => document.getElementById(id);

  var supabaseClient = null;
  function dbReady() {
    return !!(CONFIG.database && CONFIG.database.enabled && CONFIG.database.supabaseUrl && CONFIG.database.supabaseAnonKey);
  }
  function initDb() {
    if (!dbReady()) return;
    if (typeof supabase === 'undefined') { setSaveStatus('DB script failed to load'); return; }
    try {
      supabaseClient = supabase.createClient(CONFIG.database.supabaseUrl, CONFIG.database.supabaseAnonKey);
    } catch (e) { console.error(e); setSaveStatus('DB connection error'); }
  }
  function setSaveStatus(msg) {
    var el = $('saveStatus');
    if (el) el.textContent = msg;
  }
  function loadFromDatabase() {
    if (!supabaseClient) return Promise.resolve(false);
    return supabaseClient.from(CONFIG.database.table).select('data').eq('id', CONFIG.database.rowId).single()
      .then(function(res) {
        if (res.error || !res.data) return false;
        var db = CONFIG.database;
        Object.keys(res.data.data).forEach(function(k) { CONFIG[k] = res.data.data[k]; });
        CONFIG.database = db;
        return true;
      })
      .catch(function() { return false; });
  }
  function saveToDatabase() {
    if (!supabaseClient) { setSaveStatus('Database not connected'); return Promise.resolve(false); }
    setSaveStatus('Saving...');
    return supabaseClient.from(CONFIG.database.table)
      .upsert({ id: CONFIG.database.rowId, data: CONFIG, updated_at: new Date().toISOString() })
      .then(function(res) {
        if (res.error) { setSaveStatus('Save failed'); console.error(res.error); return false; }
        setSaveStatus('Saved ' + new Date().toLocaleTimeString());
        return true;
      })
      .catch(function(e) { setSaveStatus('Save failed'); console.error(e); return false; });
  }
  function storageReady() {
    return dbReady() && !!CONFIG.database.bucket && !!supabaseClient;
  }

  function applyTheme() {
    document.documentElement.style.setProperty('--accent', CONFIG.theme.accent);
    document.documentElement.style.setProperty('--accent2', CONFIG.theme.accent2);
    document.documentElement.style.setProperty('--bg', CONFIG.theme.bg);
    updateTextContrast();
  }
  function updateTextContrast() {
    var hex = CONFIG.theme.bg.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(function(c){ return c + c; }).join('');
    var r = parseInt(hex.substr(0, 2), 16), g = parseInt(hex.substr(2, 2), 16), b = parseInt(hex.substr(4, 2), 16);
    var luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    var root = document.documentElement.style;
    if (luminance > 0.55) {
      root.setProperty('--text', '#2a2a2a');
      root.setProperty('--text-dim', '#6a6a6a');
      root.setProperty('--heading', '#0a0a0a');
      root.setProperty('--panel', '#f0f0f0');
      root.setProperty('--panel-2', '#e6e6e6');
      root.setProperty('--border', '#d5d5d5');
    } else {
      root.setProperty('--text', '#c7c7c7');
      root.setProperty('--text-dim', '#7a7a7a');
      root.setProperty('--heading', '#f2f2f2');
      root.setProperty('--panel', '#1c1c1c');
      root.setProperty('--panel-2', '#181818');
      root.setProperty('--border', '#2c2c2c');
    }
  }

  function applyEditableState() {
    document.querySelectorAll('[data-field], [data-edit]').forEach(function(el) { el.contentEditable = editMode; });
    document.body.classList.toggle('edit-mode', editMode);

  /* ---------- GENERIC PHOTO SLOT ---------- */
  function renderPhotoSlot(container, url, pathHint, onSet, onRemove) {
    container.innerHTML = '';
    container.style.position = 'relative';
    if (url) {
      var img = document.createElement('img');
      img.src = url;
      img.alt = '';
      container.appendChild(img);
      if (editMode) {
        var controls = document.createElement('div');
        controls.className = 'photo-controls';
        var replaceBtn = document.createElement('button');
        replaceBtn.textContent = 'Replace';
        replaceBtn.onclick = function() { uploadPhotoFor(onSet, pathHint); };
        var removeBtn = document.createElement('button');
        removeBtn.textContent = 'Remove';
        removeBtn.onclick = onRemove;
        controls.appendChild(replaceBtn);
        controls.appendChild(removeBtn);
        container.appendChild(controls);
      }
    } else if (editMode) {
      var empty = document.createElement('div');
      empty.className = 'photo-upload-empty';
      var btn = document.createElement('button');
      btn.className = 'photo-upload-btn';
      btn.textContent = '+ Photo';
      btn.onclick = function() { uploadPhotoFor(onSet, pathHint); };
      empty.appendChild(btn);
      container.appendChild(empty);
    }
  }

  function uploadPhotoFor(setter, pathHint) {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = function() {
      var file = input.files[0];
      if (!file) return;
      setSaveStatus('Processing photo...');
      resizeImageToBlob(file, 900, 0.85).then(function(result) {
        if (storageReady()) {
          setSaveStatus('Uploading photo...');
          return uploadImageBlob(result.blob, pathHint)
            .then(function(url) { setSaveStatus('Photo uploaded'); setter(url); })
            .catch(function(e) {
              console.error(e);
              setSaveStatus('Upload failed, saved locally instead');
              setter(result.dataUrl);
            });
        } else {
          setter(result.dataUrl);
        }
      }).catch(function(e) {
        console.error(e);
        alert('Could not load that image.');
      });
    };
    input.click();
  }

  function uploadImageBlob(blob, pathHint) {
    var path = pathHint + '-' + Date.now() + '.jpg';
    return supabaseClient.storage.from(CONFIG.database.bucket)
      .upload(path, blob, { contentType: 'image/jpeg', upsert: true })
      .then(function(res) {
        if (res.error) throw res.error;
        var pub = supabaseClient.storage.from(CONFIG.database.bucket).getPublicUrl(path);
        return pub.data.publicUrl;
      });
  }

  function resizeImageToBlob(file, maxWidth, quality) {
    return new Promise(function(resolve, reject) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var scale = Math.min(1, maxWidth / img.width);
          var canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(function(blob) {
            if (!blob) { reject(new Error('Could not process image')); return; }
            resolve({ blob: blob, dataUrl: canvas.toDataURL('image/jpeg', quality) });
          }, 'image/jpeg', quality);
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  /* ---------- ABOUT / HELLO ---------- */
  function renderAbout() {
    $('helloText').textContent = CONFIG.about.helloText;
    $('bioText').textContent = CONFIG.about.bio;

    renderPhotoSlot($('helloPhoto'), CONFIG.about.photo, 'about', function(url) {
      CONFIG.about.photo = url;

    }, function() {
      CONFIG.about.photo = null;
      renderAbout();
    });

    var pillsEl = $('contactPills');
    pillsEl.innerHTML = '';
    CONFIG.about.socials.forEach(function(s, i) {
      var pill = document.createElement('div');
      pill.className = 'contact-pill';
      pill.innerHTML =

        '<span data-edit="true" data-i="' + i + '" data-part="handle">' + s.handle + '</span>' +
        (editMode ? '<button class="contact-remove" data-i="' + i + '">\u00d7</button>' : '');
      pillsEl.appendChild(pill);
    });
    if (editMode) {
      pillsEl.querySelectorAll('.contact-remove').forEach(function(btn) {

          syncAboutFromDom();

          renderAbout();

    renderExperience();
    renderSkills();
    renderLanguages();

  function syncAboutFromDom() {
    CONFIG.about.helloText = $('helloText').textContent.trim();
    CONFIG.about.bio = $('bioText').textContent.trim();
    CONFIG.about.socials = Array.prototype.map.call($('contactPills').querySelectorAll('.contact-pill'), function(p) {
      return { platform: p.querySelector('[data-part="platform"]').textContent.trim(), handle: p.querySelector('[data-part="handle"]').textContent.trim() };
    });
    CONFIG.about.education = Array.prototype.map.call($('educationList').querySelectorAll('.edu-item'), function(el) {
      return { years: el.querySelector('[data-part="years"]').textContent.trim(), school: el.querySelector('[data-part="school"]').textContent.trim(), detail: el.querySelector('[data-part="detail"]').textContent.trim() };
    });
    CONFIG.about.experience = Array.prototype.map.call($('experienceList').querySelectorAll('.exp-item'), function(el) {
      return { title: el.querySelector('[data-part="title"]').textContent.trim(), detail: el.querySelector('[data-part="detail"]').textContent.trim() };
    });
    CONFIG.about.skills = Array.prototype.map.call($('skillsList').querySelectorAll('.skill-line span[data-edit]'), function(el) { return el.textContent.trim(); });
    CONFIG.about.languages = Array.prototype.map.call($('languageRows').querySelectorAll('.lang-row-v2'), function(el) {
      var pctText = el.querySelector('[data-part="percent"]').textContent.replace('%', '').trim();
      var pct = parseInt(pctText, 10);
      if (isNaN(pct)) pct = 0;
      return { name: el.querySelector('[data-part="name"]').textContent.trim(), percent: pct };
    });
  }

  /* ---------- PROJECTS ---------- */
  function renderProjects() {
    $('projectsTitle').textContent = CONFIG.projects.title;
    $('projectsYearTag').textContent = CONFIG.projects.yearTag;

    var grid = $('projectsGrid');
    grid.innerHTML = '';
    CONFIG.projects.items.forEach(function(p, i) {
      var tile = document.createElement('div');
      tile.className = 'project-tile';
      if (p.image) {
        tile.innerHTML = '<img src="' + p.image + '" alt="' + p.title + '">' +
          '<div class="project-tile-title" data-edit="true" data-i="' + i + '">' + p.title + '</div>' +
          (editMode ? '<button class="project-tile-remove" data-i="' + i + '">\u00d7</button>' : '');
      } else {
        tile.classList.add('project-tile-empty');
        if (editMode) {
          tile.innerHTML = '<div class="photo-upload-empty"><button class="photo-upload-btn" data-i="' + i + '">+ Photo</button></div>';
        }
      }
      grid.appendChild(tile);
    });

    if (editMode) {
      var addTile = document.createElement('button');
      addTile.className = 'project-tile-add';
      addTile.textContent = '+ Project';
      addTile.onclick = function() {
        syncProjectsFromDom();
        CONFIG.projects.items.push({ title: 'New Project', image: null });
        renderProjects();
      };
      grid.appendChild(addTile);

      grid.querySelectorAll('.project-tile-remove').forEach(function(btn) {
        btn.onclick = function() { syncProjectsFromDom(); CONFIG.projects.items.splice(+btn.dataset.i, 1); renderProjects(); };
      });
      grid.querySelectorAll('.project-tile-empty .photo-upload-btn').forEach(function(btn) {
        btn.onclick = function() {
          var i = +btn.dataset.i;
          syncProjectsFromDom();
          uploadPhotoFor(function(url) { CONFIG.projects.items[i].image = url; renderProjects(); }, 'project-' + i);
        };
      });
    }
    applyEditableState();
  }

  function syncProjectsFromDom() {
    CONFIG.projects.title = $('projectsTitle').textContent.trim();
    CONFIG.projects.yearTag = $('projectsYearTag').textContent.trim();
    $('projectsGrid').querySelectorAll('.project-tile-title').forEach(function(el) {
      var i = +el.dataset.i;
      if (CONFIG.projects.items[i]) CONFIG.projects.items[i].title = el.textContent.trim();

  function renderFooter() {
    $('footerName').textContent = CONFIG.tagline.name2 + ' \u2014 ' + CONFIG.siteName;
    $('footerCopyright').textContent = CONFIG.tagline.copyrightText;
  }

  function renderAll() {
    renderHero();
    renderTagline();
    renderAbout();
    renderProjects();
    renderFooter();
    applyEditableState();
  }
  function syncEverythingFromDom() {
    syncHeroFromDom();
    syncTaglineFromDom();
    syncAboutFromDom();
    syncProjectsFromDom();
  }

  /* ---------- EDITOR MODE ---------- */
  function unlockEditor() {
    editMode = true;
    $('editorControls').classList.remove('hidden');
    $('editorToggleBtn').textContent = 'Lock';
    $('accentPicker').value = CONFIG.theme.accent;
    $('bgPicker').value = CONFIG.theme.bg;
    ['addEduBtn', 'addExpBtn', 'addSkillBtn', 'addLangBtn'].forEach(function(id) { $(id).classList.remove('hidden'); });
    renderAll();
  }
  function lockEditor() {
    syncEverythingFromDom();
    editMode = false;
    $('editorControls').classList.add('hidden');
    $('editorToggleBtn').textContent = 'Editor';
    ['addEduBtn', 'addExpBtn', 'addSkillBtn', 'addLangBtn'].forEach(function(id) { $(id).classList.add('hidden'); });
    renderAll();
    if (dbReady()) saveToDatabase();
  }

  function openLogin() {
    $('loginOverlay').classList.remove('hidden');
    $('loginError').classList.add('hidden');
    $('loginPassword').value = '';
    $('loginPassword').focus();
  }
  function closeLogin() { $('loginOverlay').classList.add('hidden'); }

  function downloadHtml() {
    if (editMode) syncEverythingFromDom();
    var wasEditing = editMode;
    if (wasEditing) lockEditor();
    $('configData').textContent = JSON.stringify(CONFIG, null, 2);
    var htmlStr = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    var blob = new Blob([htmlStr], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'video-editor.html';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  /* ---------- INIT / EVENTS ---------- */
  initDb();
  Promise.resolve(dbReady() ? loadFromDatabase() : false).then(function(loaded) {
    if (loaded) setSaveStatus('Loaded saved version');
    applyTheme();
    renderAll();
  });

  $('editorToggleBtn').onclick = function() { editMode ? lockEditor() : openLogin(); };
  $('loginCancel').onclick = closeLogin;
  $('loginOverlay').addEventListener('click', function(e) { if (e.target.id === 'loginOverlay') closeLogin(); });
  $('loginSubmit').onclick = function() {
    if ($('loginPassword').value === CONFIG.editorPassword) { closeLogin(); unlockEditor(); }
    else { $('loginError').classList.remove('hidden'); }
  };
  $('loginPassword').addEventListener('keydown', function(e) { if (e.key === 'Enter') $('loginSubmit').click(); });

  $('addEduBtn').onclick = function() { syncAboutFromDom(); CONFIG.about.education.push({ years: 'Year - Year', school: 'School name', detail: 'Detail' }); renderAbout(); };
  $('addExpBtn').onclick = function() { syncAboutFromDom(); CONFIG.about.experience.push({ title: 'Year', detail: 'Role, Company' }); renderAbout(); };
  $('addSkillBtn').onclick = function() { syncAboutFromDom(); CONFIG.about.skills.push('New skill'); renderAbout(); };
  $('addLangBtn').onclick = function() { syncAboutFromDom(); CONFIG.about.languages.push({ name: 'Language', percent: 50 }); renderAbout(); };
  $('addSocialBtn').onclick = function() { syncAboutFromDom(); CONFIG.about.socials.push({ platform: 'Platform', handle: 'value' }); renderAbout(); };
  $('addProjectBtn').onclick = function() { syncProjectsFromDom(); CONFIG.projects.items.push({ title: 'New Project', image: null }); renderProjects(); };

  $('saveDbBtn').onclick = function() {
    syncEverythingFromDom();
    if (!dbReady()) { setSaveStatus('Connect a database first (see file comments)'); return; }
    saveToDatabase();
  };
  $('exportBtn').onclick = downloadHtml;
  $('accentPicker').oninput = function(e) { CONFIG.theme.accent = e.target.value; document.documentElement.style.setProperty('--accent', e.target.value); };
  $('bgPicker').oninput = function(e) { CONFIG.theme.bg = e.target.value; document.documentElement.style.setProperty('--bg', e.target.value); updateTextContrast(); };
})();
